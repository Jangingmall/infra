name: Kubernetes validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'argocd/**'
      - 'scripts/validate-gitops.rb'
      - 'scripts/validate-observability.*'
      - 'scripts/validate-observability-gitops.sh'
      - 'scripts/render-observability.rb'
      - 'scripts/validate-tempo.rb'
      - 'scripts/validate-networking.rb'
      - 'scripts/validate-data-services.rb'
      - 'scripts/verify-redis.sh'
      - 'scripts/validate-alerting.*'
      - 'scripts/validate-ai-observability.*'
      - 'scripts/validate-platform-monitoring.rb'
      - 'scripts/render-logs.sh'
      - 'scripts/validate-logs.rb'
      - 'platform/**'
      - 'scripts/validate-k8s.sh'
      - '.github/workflows/k8s-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Kustomize and Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'v1.36.1'

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v3.21.4'

      - name: Validate Kubernetes configuration
        run: bash scripts/validate-k8s.sh
