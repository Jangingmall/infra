apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# ObjectStore/IRSA/플러그인 준비 후에만 환경 overlay의 components에 추가한다.
# Cluster는 workloads Application만 소유한다. backup Application에서 중복 생성하지 않는다.
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: jangingmall-postgres
      namespace: database
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: cnpg-backup
      - op: add
        path: /spec/postgresql/parameters/archive_timeout
        value: "5min"
