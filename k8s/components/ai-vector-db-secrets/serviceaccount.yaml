apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-vector-db-sa
  namespace: ai
# TODO(배포 전, 인프라→네이티브): 환경별 실제 IRSA Role ARN을 받아
# 각 overlay에서 metadata.annotations[eks.amazonaws.com/role-arn]을 patch한다.
# 신뢰 대상: system:serviceaccount:ai:ai-vector-db-sa / audience: sts.amazonaws.com.
# ARN이 연결되지 않은 현재 상태로는 워크로드 배포를 진행하지 않는다.
automountServiceAccountToken: false
