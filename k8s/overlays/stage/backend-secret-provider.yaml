apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-config
  namespace: app
spec:
  provider: aws
  parameters:
    region: ap-northeast-2
    usePodIdentity: 'false'
    objects: |
      - objectName: "/staging/backend/db-url"
        objectType: ssmparameter
        objectAlias: DB_URL
        filePermission: '0444'
      - objectName: "/staging/backend/db-username"
        objectType: ssmparameter
        objectAlias: DB_USERNAME
        filePermission: '0444'
      - objectName: "/staging/backend/db-password"
        objectType: ssmparameter
        objectAlias: DB_PASSWORD
        filePermission: '0444'
      - objectName: "/staging/backend/redis-host"
        objectType: ssmparameter
        objectAlias: REDIS_HOST
        filePermission: '0444'
      - objectName: "/staging/backend/jwt-secret"
        objectType: ssmparameter
        objectAlias: JWT_SECRET
        filePermission: '0444'
      - objectName: "/staging/backend/kakao-client-id"
        objectType: ssmparameter
        objectAlias: KAKAO_CLIENT_ID
        filePermission: '0444'
      - objectName: "/staging/backend/kakao-client-secret"
        objectType: ssmparameter
        objectAlias: KAKAO_CLIENT_SECRET
        filePermission: '0444'
      - objectName: "/staging/backend/naver-client-id"
        objectType: ssmparameter
        objectAlias: NAVER_CLIENT_ID
        filePermission: '0444'
      - objectName: "/staging/backend/naver-client-secret"
        objectType: ssmparameter
        objectAlias: NAVER_CLIENT_SECRET
        filePermission: '0444'
      - objectName: "/staging/backend/mail-host"
        objectType: ssmparameter
        objectAlias: MAIL_HOST
        filePermission: '0444'
      - objectName: "/staging/backend/mail-username"
        objectType: ssmparameter
        objectAlias: MAIL_USERNAME
        filePermission: '0444'
      - objectName: "/staging/backend/mail-password"
        objectType: ssmparameter
        objectAlias: MAIL_PASSWORD
        filePermission: '0444'
      - objectName: "/staging/backend/mail-from"
        objectType: ssmparameter
        objectAlias: MAIL_FROM
        filePermission: '0444'
      - objectName: "/staging/backend/oauth-frontend-redirect-url"
        objectType: ssmparameter
        objectAlias: OAUTH_FRONTEND_REDIRECT_URL
        filePermission: '0444'
      - objectName: "/staging/backend/ai-base-url"
        objectType: ssmparameter
        objectAlias: AI_BASE_URL
        filePermission: '0444'
