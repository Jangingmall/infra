resources:
  - ../../base
  - ../../base/network-policies/database
  - ../../base/network-policies/ai/ingress
  - backend-secret-provider.yaml
  - redis-secret-provider.yaml
  - ai-vector-db-secret-provider.yaml
  - ai-chatbot-secret-provider.yaml
  - ai-sglang-secret-provider.yaml

configMapGenerator:
  - name: ai-sglang-model-source
    namespace: ai
    literals:
      - s3-uri=s3://jangin-prod-s3-models/page-generation/20260923/
      - manifest-sha256=91f2cb7959cfa0e76d80b9e60ec239fa397eb3bd023c04b27196a87fd8095661
  - name: ai-chatbot-model-source
    namespace: ai
    literals:
      - s3-uri=s3://jangin-prod-s3-models/chatbot/embedding/20260923-v2/
      - manifest-sha256=d440eafd3342b8042500871d5929d79c36f0a3412ca2b4cdde890baf682f5ed1

# Argo CD selfHeal이 적용되므로 kubectl scale 대신 이 replicas 블록을 Git에서 변경한다.
replicas:
  - name: ai-sglang
    count: 1
  - name: ai-ollama
    count: 1
  - name: ai-vector-db
    count: 1

# Stage에 생성된 IRSA 역할을 각 Pod의 ServiceAccount에 연결한다.
# 신뢰 정책의 app/backend-sa, app/redis-sa와 이름·namespace가 일치해야 한다.
# 이 annotation은 권한 연결만 담당하며 SSM 값이나 DB 초기 Secret을 생성하지 않는다.
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: backend
      namespace: app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_MAIL_PORT
          value: "587"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
          value: "true"
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: cnpg-backup-sa
        namespace: database
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::750240012008:role/jangin-staging-irsa-cnpg
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: backend-sa
        namespace: app
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::750240012008:role/jangin-staging-irsa-backend
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: redis-sa
        namespace: app
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::750240012008:role/jangin-staging-irsa-redis
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ai-worker-sa
        namespace: ai
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::750240012008:role/jangin-staging-irsa-ai
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ai-vector-db-sa
        namespace: ai
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::750240012008:role/jangin-staging-irsa-ai-vector-db

components:
  - ../../components/cnpg-backup
  - ../../components/backend-configtree
  - ../../components/gitops-protection
  - ../../components/ai-vector-db-secrets
  - ../../components/ai-sglang-secrets
  - ../../components/ai-model-storage
