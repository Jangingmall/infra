apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ai-chatbot-config
  namespace: ai
spec:
  provider: aws
  parameters:
    region: ap-northeast-2
    usePodIdentity: 'false'
    # TODO(인프라): 실제 경로 확정 및 ai-worker-sa IRSA에 이 파라미터만 조회 권한 부여.
    # 공유 SA이므로 SGLang에도 권한이 적용된다. 관리자 비밀번호 권한은 부여하지 않는다.
    objects: |
      - objectName: "/staging/ai/vector-db/password"
        objectType: ssmparameter
        objectAlias: password
        filePermission: '0444'
