apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ai-sglang-config
  namespace: ai
spec:
  provider: aws
  parameters:
    region: ap-northeast-2
    usePodIdentity: 'false'
    # 제안 SSM 경로다. 실제 등록과 ai-worker-sa의 제한된 GetParameter/KMS 권한이 선행되어야 한다.
    # callback 토큰은 Backend configtree와 동일 파라미터를 읽는다. Kubernetes Secret으로 복사하지 않는다.
    objects: |
      - objectName: "/prod/backend/backend-auth-token"
        objectType: ssmparameter
        objectAlias: backend-auth-token
        filePermission: '0444'
      - objectName: "/prod/ai/internal-auth-token"
        objectType: ssmparameter
        objectAlias: ai-internal-auth-token
        filePermission: '0444'
