apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ai-vector-db-config
  namespace: ai
spec:
  provider: aws
  parameters:
    region: ap-northeast-2
    usePodIdentity: 'false'
    # TODO(배포 전, 인프라): 아래 제안 경로를 팀 경로 규칙과 대조해 확정하고,
    # 관리자/AI 계정 비밀번호 두 개를 환경별 SecureString으로 생성한다.
    # TODO(네이티브): 확정된 경로를 아래 objects와 validate-gitops.rb에 함께 반영한다.
    # 실제 비밀번호는 Git에 기록하지 않는다. IRSA의 SSM/KMS 권한 준비 후 배포한다.
    objects: |
      - objectName: "/prod/ai/vector-db/postgres-password"
        objectType: ssmparameter
        objectAlias: postgres-password
        filePermission: '0444'
      - objectName: "/prod/ai/vector-db/password"
        objectType: ssmparameter
        objectAlias: password
        filePermission: '0444'
  secretObjects:
    - secretName: ai-vector-db-auth
      type: Opaque
      data:
        - objectName: postgres-password
          key: postgres-password
        - objectName: password
          key: password
