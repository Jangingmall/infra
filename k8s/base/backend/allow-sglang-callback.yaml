# 이 정책도 Backend ingress를 격리한다. ALB/Prometheus 허용은 각 배포 묶음에서 제공한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sglang-callback
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-sglang
      ports:
        - {protocol: TCP, port: 8080}
