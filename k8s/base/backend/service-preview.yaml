apiVersion: v1
kind: Service
metadata:
  name: backend-preview
  namespace: app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: jangingmall
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 9090
      targetPort: management
      protocol: TCP
