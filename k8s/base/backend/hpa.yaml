apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 운영 실측 전 초기 목표. CPU request 700m의 70% = 490m.
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
