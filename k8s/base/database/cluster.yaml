apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: jangingmall-postgres
  namespace: database

spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  serviceAccountName: cnpg-backup-sa

  bootstrap:
    initdb:
      database: jangingmall
      owner: jangingmall
      secret:
        name: jangingmall-postgres-app

  affinity:
    nodeSelector:
      workload-type: db
    tolerations:
      - key: workload
        operator: Equal
        value: db
        effect: NoSchedule
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  storage:
    storageClass: gp3-cnpg
    size: 20Gi
