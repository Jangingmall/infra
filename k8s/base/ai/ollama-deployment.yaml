apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ollama
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-ollama
    app.kubernetes.io/part-of: jangingmall
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # API와 LLM을 함께 교체한다. 기존 Pod가 T4 GPU를 반환한 뒤 새 Pod를 시작한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ollama
        app.kubernetes.io/part-of: jangingmall
    spec:
      serviceAccountName: ai-worker-sa
      nodeSelector:
        workload-type: gpu
        gpu-model: t4
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-ollama
          # 실제 ECR image/digest는 환경 Overlay에서 교체한다.
          image: jangin-ai/chatbot-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: LLM_BACKEND
              value: sglang
            - name: SGLANG_HOST
              value: http://127.0.0.1:30000
            - name: LLM_MODEL
              value: gemma4-12b-awq
            - name: DB_HOST
              value: ai-vector-db.ai.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: midam
            - name: DB_USER
              value: ai_chatbot
            # AI 코드에서 파일 읽기를 지원한다. 지원 코드가 포함된 발행 digest로 배포한다.
            - name: DB_PASSWORD_FILE
              value: /mnt/secrets-store/password
          startupProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            # 앱 lifespan의 임베딩/LLM 예열이 완료되기까지 기다린다. GPU 검증 후 조정한다.
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /ai/ready
              port: http
            periodSeconds: 10
            # DB 접속과 LLM 확인이 순차 실행된다. 실제 추론 성공은 별도 기능 검증 대상이다.
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # 현재 이미지는 CPU용 API/임베딩이다. GPU는 별도 LLM 컨테이너에 할당한다.
          # TODO(AI): 모델 실측 후 CPU/Memory requests·limits를 추가한다.
        - name: chatbot-llm
          # GenAI chat_bot/deploy/sglang/Dockerfile에서 발행한 digest를 overlay에 연결한다.
          image: jangin-ai/chatbot-llm
          imagePullPolicy: IfNotPresent
          # 이미지의 shell ENTRYPOINT 대신 추론 서버를 PID 1로 실행해 SIGTERM을 전달한다.
          # 로컬 S3 번들은 manifest hash로 고정하므로 Hub용 --revision은 전달하지 않는다.
          command: [python3, -m, sglang.launch_server]
          args:
            - --model-path
            - $(MODEL_PATH)
            - --served-model-name
            - $(SERVED_MODEL_NAME)
            - --quantization
            - awq
            - --grammar-backend
            - outlines
            - --host
            - 127.0.0.1
            - --port
            - "30000"
          env:
            # 모델 component가 실제 번들 경로로 교체한다. 기본값으로 Hub 다운로드하지 않는다.
            - name: MODEL_PATH
              value: /models/llm
            - name: SERVED_MODEL_NAME
              value: gemma4-12b-awq
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          # loopback에만 bind하므로 kubelet의 Pod IP HTTP probe 대신 컨테이너 내부에서 확인한다.
          startupProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30000/v1/models', timeout=3)"]
            periodSeconds: 10
            timeoutSeconds: 5
            # 초기 20분 예산. 실제 T4 로딩 시간을 측정한 뒤 조정한다.
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30000/v1/models', timeout=3)"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              nvidia.com/gpu: 1
          # CPU/RAM·KV cache·동시 요청 한도는 T4 실측 후 확정한다. GPU 예약은 용량 검증이 아니다.
          volumeMounts:
            - name: llm-shm
              mountPath: /dev/shm
      volumes:
        # SGLang 프로세스 간 공유 메모리. 1Gi는 상한이며 사용량은 노드 RAM에 포함된다.
        - name: llm-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
