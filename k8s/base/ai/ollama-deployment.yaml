apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ollama
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-ollama
    app.kubernetes.io/part-of: jangingmall
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # API와 LLM을 함께 교체한다. 기존 Pod가 T4 GPU를 반환한 뒤 새 Pod를 시작한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ollama
        app.kubernetes.io/part-of: jangingmall
    spec:
      serviceAccountName: ai-worker-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workload-type: gpu
        gpu-model: t4
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-ollama
          # 실제 ECR image/digest는 환경 Overlay에서 교체한다.
          image: jangin-ai/chatbot-api
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: LLM_BACKEND
              value: ollama
            - name: OLLAMA_HOST
              value: http://127.0.0.1:11434
            - name: LLM_MODEL
              value: gemma4:12b
            - name: DB_HOST
              value: ai-vector-db.ai.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: midam
            - name: DB_USER
              value: ai_chatbot
            # AI 코드에서 파일 읽기를 지원한다. 지원 코드가 포함된 발행 digest로 배포한다.
            - name: DB_PASSWORD_FILE
              value: /mnt/secrets-store/password
          startupProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            # 앱 lifespan의 임베딩/LLM 예열이 완료되기까지 기다린다. GPU 검증 후 조정한다.
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /ai/ready
              port: http
            periodSeconds: 10
            # DB 접속과 LLM 확인이 순차 실행된다. 실제 추론 성공은 별도 기능 검증 대상이다.
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: api-cache
              mountPath: /home/appuser/.cache
            - name: tmp
              mountPath: /tmp
        - name: chatbot-llm
          image: jangin-ai/chatbot-llm
          imagePullPolicy: IfNotPresent
          # 현재 이미지는 모델이 /root/.ollama에 있고 root로 실행한다.
          # 비루트 전환은 AI 이미지의 모델 경로/권한 변경 후 수행한다.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: ollama
              containerPort: 11434
          startupProbe:
            httpGet:
              path: /api/tags
              port: ollama
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/tags
              port: ollama
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 6Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "2"
              memory: 10Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-cache
              mountPath: /root/.ollama/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: api-cache
          emptyDir: {}
        - name: ollama-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
