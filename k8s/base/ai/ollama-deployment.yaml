apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ollama
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-ollama
    app.kubernetes.io/part-of: jangingmall
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # T4 GPU 1개를 기존 Pod가 반환한 뒤 새 Pod를 시작한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ollama
        app.kubernetes.io/part-of: jangingmall
    spec:
      serviceAccountName: ai-worker-sa
      nodeSelector:
        workload-type: gpu
        gpu-model: t4
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-ollama
          # 실제 ECR image/digest는 환경 Overlay에서 교체한다.
          image: jangin-ai/ollama
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_HOST
              value: ai-vector-db.ai.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: midam
            - name: DB_USER
              value: ai_chatbot
            # TODO(AI, 배포 전): DB_PASSWORD_FILE을 읽는 이미지/digest가 필요하다.
            - name: DB_PASSWORD_FILE
              value: /mnt/secrets-store/password
          startupProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            limits:
              nvidia.com/gpu: 1
          # TODO(AI): 모델 실측 후 CPU/Memory requests·limits를 추가한다.
