apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ollama
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-ollama
    app.kubernetes.io/part-of: jangingmall
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # 단일 챗봇 인스턴스를 교체한다. LLM 추가 시에도 GPU 중복 할당을 피한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ollama
        app.kubernetes.io/part-of: jangingmall
    spec:
      serviceAccountName: ai-worker-sa
      nodeSelector:
        workload-type: gpu
        gpu-model: t4
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-ollama
          # 실제 ECR image/digest는 환경 Overlay에서 교체한다.
          image: jangin-ai/ollama
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_HOST
              value: ai-vector-db.ai.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: midam
            - name: DB_USER
              value: ai_chatbot
            # AI 코드에서 파일 읽기를 지원한다. 지원 코드가 포함된 발행 digest로 배포한다.
            - name: DB_PASSWORD_FILE
              value: /mnt/secrets-store/password
          startupProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            # 앱 lifespan의 임베딩/LLM 예열이 완료되기까지 기다린다. GPU 검증 후 조정한다.
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /ai/ready
              port: http
            periodSeconds: 10
            # DB 접속과 LLM 확인이 순차 실행된다. 실제 추론 성공은 별도 기능 검증 대상이다.
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # 현재 이미지는 CPU용 API/임베딩이다. GPU는 별도 LLM 컨테이너에 할당한다.
          # TODO(AI): 모델 실측 후 CPU/Memory requests·limits를 추가한다.
