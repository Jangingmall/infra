apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: jangingmall
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-worker
        app.kubernetes.io/part-of: jangingmall
    spec:
      serviceAccountName: ai-worker-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-worker
          # 실제 ECR image/digest는 환경 Overlay에서 교체한다.
          image: jangin-ai
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # TODO(AI): 실제 모델과 GPU 노드 스펙이 확정되면
          # cpu/memory/GPU requests·limits와 nodeSelector/tolerations를 추가한다.
