apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sglang
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-sglang
    app.kubernetes.io/part-of: jangingmall
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # L40S GPU 1개를 기존 Pod가 반환한 뒤 새 Pod를 시작한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sglang
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sglang
        app.kubernetes.io/part-of: jangingmall
    spec:
      serviceAccountName: ai-worker-sa
      nodeSelector:
        workload-type: gpu
        gpu-model: l40s
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-sglang
          # 실제 ECR image/digest는 환경 Overlay에서 교체한다.
          image: jangin-ai/sglang
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: BACKEND_URL
              # AI 클라이언트가 /internal/generations/{generation_id}/completion을 붙인다.
              value: http://backend-active.app.svc.cluster.local:8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            # readiness가 text/image 서버를 각각 최대 2초 확인하므로 합산 시간보다 여유 있게 둔다.
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            limits:
              nvidia.com/gpu: 1
          # TODO(AI): 모델 실측 후 CPU/Memory requests·limits를 추가한다.
