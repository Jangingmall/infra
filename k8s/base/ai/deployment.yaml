apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: jangingmall
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # L40S GPU 1개를 기존 Pod가 반환한 뒤 새 Pod를 시작한다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-worker
        app.kubernetes.io/part-of: jangingmall
    spec:
      serviceAccountName: ai-worker-sa
      nodeSelector:
        workload-type: gpu
        gpu-model: l40s
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-worker
          # 실제 ECR image/digest는 환경 Overlay에서 교체한다.
          image: jangin-ai
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ai/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            limits:
              nvidia.com/gpu: 1
          # TODO(AI): 모델 실측 후 CPU/Memory requests·limits를 추가한다.
