bind 0.0.0.0
protected-mode yes
port 6379
daemonize no
dir /data
logfile ""
appendonly yes
appendfsync everysec
save 900 1
# 인증 토큰을 메모리 압박 때문에 임의 삭제하지 않는다. 한도 초과 쓰기는 실패하므로 용량을 관측한다.
maxmemory 128mb
maxmemory-policy noeviction
maxclients 200
# AOF/RDB fork·버퍼 비용은 maxmemory 밖에도 존재한다. Pod limit 및 실제 RSS를 함께 확인한다.
