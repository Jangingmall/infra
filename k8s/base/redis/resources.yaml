apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: app
# 실제 환경별 IRSA ARN은 overlay에서 주입. backend-sa와 같은 Redis SSM 비밀번호를 읽는다.
automountServiceAccountToken: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-redis
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  tagSpecification_1: "NodePool=app"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: app
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: app
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  serviceName: redis-headless
  # ponytail: 단일 인스턴스다. 노드 장애 중 자동 HA가 필요하면 Replica/Sentinel을 별도로 설계한다.
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      serviceAccountName: redis-sa
      automountServiceAccountToken: false
      nodeSelector:
        workload-type: app
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:7.4.11-bookworm
          command: [/bin/sh, /etc/redis/start.sh]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [/bin/sh, /etc/redis/health.sh]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/bin/sh, /etc/redis/health.sh]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [/bin/sh, /etc/redis/health.sh]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: config, mountPath: /etc/redis, readOnly: true}
            - {name: credentials, mountPath: /mnt/redis-secrets, readOnly: true}
            - {name: runtime, mountPath: /run/redis}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: redis-config
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: gp3-redis
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-backend-only
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - {protocol: TCP, port: 6379}
  # Redis는 수신 요청에 응답하며 외부 서비스를 호출하지 않는다. CSI AWS 호출은 provider의 경로다.
  egress: []
