# Chart argo-cd 10.9.1 / Argo CD v3.5.3. 환경별 EKS에 개별 설치.
global:
  nodeSelector:
    workload-type: system
configs:
  cm:
    application.resourceTrackingMethod: annotation
    exec.enabled: "false"
    users.anonymous.enabled: "false"
  params:
    server.insecure: false
  rbac:
    policy.default: role:readonly
controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
redisSecretInit:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
dex:
  enabled: false
applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
notifications:
  enabled: false
