# kube-prometheus-stack Helm values 초안
#
# ⚠️ 설치 시 release 이름을 반드시 아래로 맞출 것 (우리 ServiceMonitor/PrometheusRule/
#    AlertmanagerConfig가 전부 `release: kube-prometheus-stack` 라벨로 이 이름을 참조함):
#
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f kube-prometheus-stack-values.yaml
#
# ⚠️ 이 파일은 헬름 차트 자체 설정이고, platform/monitoring/kustomization.yaml
#    (ServiceMonitor/PrometheusRule/AlertmanagerConfig/대시보드 ConfigMap)과는 별개 배포 단위임.
#    보통 순서: 1) 이 values로 kube-prometheus-stack 설치 → 2) kustomization.yaml apply

# ─────────────────────────────────────────────────────────────
# EKS에서 스크레이프 불가능한 컨트롤플레인 컴포넌트 - 비활성화
# (EKS는 컨트롤플레인이 AWS 관리형이라 etcd/scheduler/controller-manager 메트릭 엔드포인트가
#  노출 안 됨. 기본값대로 두면 이것들에 대한 ServiceMonitor가 계속 스크레이프 실패 →
#  기본 내장 알림 규칙 때문에 "TargetDown"이 디스코드에 상시로 울림. 반드시 꺼야 함)
# ─────────────────────────────────────────────────────────────
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
# kubeProxy는 EKS에서도 대체로 스크레이프 가능하지만, VPC CNI/버전에 따라 막혀있는 경우가 있어
# TargetDown이 계속 뜨면 이것도 false로. 일단은 켜둔 채로 배포해보고 문제되면 끄기.
kubeProxy:
  enabled: true

defaultRules:
  rules:
    etcd: false
    kubeScheduler: false
    kubeControllerManager: false

# ─────────────────────────────────────────────────────────────
# Prometheus
# ─────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d              # 명시적으로 15d 적어둠 (기본값과 동일하지만, "안 정한 게 아니라 15일로 정한 것"임을 명확히 하기 위해)
    retentionSize: "18GB"       # 아래 PVC(20Gi)보다 살짝 작게 잡아서 디스크 100% 전에 오래된 데이터부터 정리되게 함

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3   # ⚠️ 실제 클러스터에 이 이름의 StorageClass가 있는지 확인 필요
                                   #    (k8s/base/storage 쪽에 정의된 StorageClass 이름과 맞춰서 교체)
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    # ⚠️ System 노드그룹에 고정 — 실제 노드그룹 이름/라벨로 교체 필요
    nodeSelector:
      eks.amazonaws.com/nodegroup: <SYSTEM_NODEGROUP_NAME>

    # release 라벨 기반 자동 선택(기본값 true)을 그대로 사용 —
    # serviceMonitorSelector / ruleSelector 를 따로 안 건드려도
    # release: kube-prometheus-stack 라벨 붙은 것만 자동으로 잡힘.
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true

# ─────────────────────────────────────────────────────────────
# Alertmanager
# ─────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    # ⚠️ PVC 없이 emptyDir 기본값 사용 — 재시작하면 침묵(silence)/중복알림 방지 기록만 날아감
    #    (알림 자체 동작에는 지장 없음). 필요해지면 storage 블록 추가해서 PVC로 전환 가능.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    nodeSelector:
      eks.amazonaws.com/nodegroup: <SYSTEM_NODEGROUP_NAME>

    # AlertmanagerConfig(janginmall-discord) 자동 병합도 release 라벨 매칭 기본값 사용
    alertmanagerConfigSelectorNilUsesHelmValues: true
    alertmanagerConfigNamespaceSelector: {}

# ─────────────────────────────────────────────────────────────
# Grafana
# ─────────────────────────────────────────────────────────────
grafana:
  persistence:
    enabled: false   # 확정: 대시보드는 ConfigMap provisioning이라 Grafana 자체 PVC 불필요

  sidecar:
    dashboards:
      enabled: false   # ⚠️ 최소화를 위해 끔 — sidecar 컨테이너(grafana-sc-dashboard) 하나가 통째로 줄어듦
      # 대신 아래 dashboardsConfigMaps로 정적 마운트 (Grafana 시작 시 1회 로드).
      # 트레이드오프: 대시보드 ConfigMap을 수정해도 Grafana 재시작 전엔 반영 안 됨(sidecar는 실시간 반영).
      # 이 프로젝트는 대시보드가 자주 안 바뀔 거라 이 트레이드오프가 리소스 절감보다 나음.
    # datasources sidecar는 그대로 둠 — kube-prometheus-stack이 번들 Prometheus 연결을
    # 이 방식으로 기본 배선하는 공식 경로라, 여기까지 끄면 Grafana가 Prometheus를 못 찾게 될 위험이
    # 더 크고 절감되는 리소스는 작아서(컨테이너 1개, ~30~50Mi) 안 건드림.

  dashboardsConfigMaps:
    default: janginmall-cpu-mem-dashboard   # 우리 ConfigMap 이름 그대로. 대시보드 늘어나면 여기 항목 추가 필요

  admin:
    # ⚠️ adminPassword 평문으로 여기 넣지 말 것. 기존 Secret 참조 방식으로.
    #    Secret은 discord-webhook과 동일하게 kubectl create secret으로 직접 만들거나
    #    secrets-store-csi로 동기화 (janginmall-discord-webhook과 같은 패턴)
    existingSecret: grafana-admin-credentials   # ⚠️ 실제 존재하는 Secret 이름으로 교체
    userKey: admin-user
    passwordKey: admin-password

  resources:
    requests:
      cpu: 30m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 200Mi

  nodeSelector:
    eks.amazonaws.com/nodegroup: <SYSTEM_NODEGROUP_NAME>

# ─────────────────────────────────────────────────────────────
# kube-state-metrics / node-exporter (기본 포함 컴포넌트)
# ─────────────────────────────────────────────────────────────
kube-state-metrics:
  # ⚠️ 대시보드 패널1,2가 쓰는 eks.amazonaws.com/nodegroup 라벨이 기본 allowlist에 없어서
  #    반드시 아래처럼 명시적으로 열어줘야 함. 안 열면 패널이 계속 빈 그래프.
  metricLabelsAllowlist:
    - nodes=[eks.amazonaws.com/nodegroup]
  # ⚠️ 최소화 — 우리가 실제 쓰는 지표는 kube_node_labels, kube_pod_container_resource_limits,
  #    kube_pod_container_status_restarts_total뿐이라 nodes/pods만 watch하도록 제한.
  #    기본값은 거의 모든 리소스 타입을 watch해서 불필요하게 무거움. 나중에 다른 지표
  #    (예: kube_deployment_status_replicas)가 필요해지면 여기에 타입 추가해야 함.
  collectors:
    - nodes
    - pods
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    eks.amazonaws.com/nodegroup: <SYSTEM_NODEGROUP_NAME>

prometheus-node-exporter:
  # DaemonSet이라 모든 노드(App/DB/GPU 포함)에 다 뜸 — nodeSelector로 System에 묶으면 안 됨
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 50m
      memory: 64Mi