apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ⚠️ 각 리소스 파일에 namespace: monitoring 이 이미 명시되어 있어서
#    여기서 namespace: 필드를 별도로 지정하지 않음(중복 방지).
#    만약 나중에 배포 환경별로 네임스페이스를 다르게 오버레이하고 싶으면
#    여기 namespace: monitoring 을 추가하고 각 리소스의 metadata.namespace는 지워도 됨.

resources:
  - configmaps/prometheus-scrape-config.yaml
  - configmaps/grafana-dashboards/janginmall-cpu-mem-dashboard.yaml
  - alert-rules/backend-alerts.yaml
  - alertmanager/alertmanager-config.yaml
#  - alertmanager/discord-webhook-secret.yaml   # ⚠️ 실제 값은 여기 커밋하지 말고 secrets-store-csi 등으로 이관 검토
      # ⚠️ 위 줄은 .example로 남겨두고 주석처리함. 실제 Secret은
      #    kubectl create secret 으로 직접 만들거나 secrets-store-csi로 동기화.
      #    파일명: alertmanager/discord-webhook-secret.yaml.example

# ⚠️ 이 kustomization.yaml 자체는 platform/monitoring/ 를 가리키는
#    ArgoCD Application(또는 상위 platform/kustomization.yaml)에서
#    source path로 참조해야 실제로 클러스터에 적용됨.