# ⚠️ prometheus-scrape-config.yaml과 동일 전제: kube-prometheus-stack(Prometheus Operator) 사용.
#    Operator가 ruleSelector로 찾아서 자동 로드하는 방식이라, release 라벨을 실제 helm release 이름과
#    맞춰야 함(안 맞으면 PrometheusRule을 만들어도 Prometheus가 조용히 무시함).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: janginmall-backend-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # ⚠️ 실제 helm release 이름으로 교체 (prometheus-scrape-config.yaml과 동일 라벨이어야 함)
spec:
  groups:
    # ── HTTP 트래픽 / 가용성 ──────────────────────────────
    - name: janginmall-backend.availability
      rules:
        - alert: BackendPodDown
          expr: up{namespace="<NAMESPACE>", pod=~"<POD_PREFIX>.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "장인몰 백엔드 파드 스크레이프 실패 ({{ $labels.pod }})"
            description: "{{ $labels.pod }} 파드가 2분 이상 Prometheus에 응답하지 않음 (다운 또는 네트워크 문제 가능)."

        - alert: BackendHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{namespace="<NAMESPACE>", status=~"5.."}[5m]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="<NAMESPACE>"}[5m]))
            ) * 100 > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "5xx 에러율 1% 초과"
            description: "최근 5분간 5xx 비율이 {{ $value | printf \"%.2f\" }}% 임. 대시보드에서 어느 엔드포인트인지 확인 필요."

        - alert: BackendHighErrorRateCritical
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{namespace="<NAMESPACE>", status=~"5.."}[5m]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="<NAMESPACE>"}[5m]))
            ) * 100 > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "5xx 에러율 5% 초과 (심각)"
            description: "최근 5분간 5xx 비율이 {{ $value | printf \"%.2f\" }}% 임. 즉시 확인 필요."

        - alert: BackendHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{namespace="<NAMESPACE>", uri!~"/actuator.*"}[5m])) by (le)
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p95 응답지연 1초 초과"
            description: "p95 지연시간이 {{ $value | printf \"%.2f\" }}s 임. histogram-percentiles 설정이 켜져 있어야 이 지표가 정상적으로 나옴."

        - alert: BackendPodRestartingTooOften
          expr: increase(kube_pod_container_status_restarts_total{namespace="<NAMESPACE>", pod=~"<POD_PREFIX>.*"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "백엔드 파드 재시작 반복 ({{ $labels.pod }})"
            description: "{{ $labels.pod }} 가 최근 15분간 3회 이상 재시작함 (CrashLoopBackOff 의심)."

    # ── JVM / Actuator ──────────────────────────────────
    - name: janginmall-backend.jvm
      rules:
        - alert: JVMHeapUsageHigh
          expr: |
            (
              sum(jvm_memory_used_bytes{namespace="<NAMESPACE>", area="heap"})
              /
              sum(jvm_memory_max_bytes{namespace="<NAMESPACE>", area="heap"})
            ) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "JVM 힙 사용률 85% 초과"
            description: "현재 힙 사용률 {{ $value | printf \"%.1f\" }}%. OOM 위험 — 힙 사이즈나 메모리 릭 확인 필요."

        - alert: JVMHeapUsageCritical
          expr: |
            (
              sum(jvm_memory_used_bytes{namespace="<NAMESPACE>", area="heap"})
              /
              sum(jvm_memory_max_bytes{namespace="<NAMESPACE>", area="heap"})
            ) * 100 > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "JVM 힙 사용률 95% 초과 (OOM 임박)"
            description: "현재 힙 사용률 {{ $value | printf \"%.1f\" }}%. 즉시 확인 필요."

        - alert: JVMGCTimeHigh
          expr: sum(rate(jvm_gc_pause_seconds_sum{namespace="<NAMESPACE>"}[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "GC 정지시간 비율 10% 초과"
            description: "GC에 소요되는 시간 비율이 {{ $value | printf \"%.2f\" }} 임. Full GC 빈발 의심 — 힙/GC 튜닝 검토."

    # ── DB 커넥션 (HikariCP + Postgres 서버측) ─────────────
    - name: janginmall-backend.db
      rules:
        - alert: HikariCPPoolNearExhaustion
          expr: |
            (
              sum(hikaricp_connections_active{namespace="<NAMESPACE>"})
              /
              sum(hikaricp_connections_max{namespace="<NAMESPACE>"})
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HikariCP 커넥션 풀 사용률 80% 초과"
            description: "앱 쪽 커넥션 풀이 {{ $value | printf \"%.1f\" }}% 사용 중. 풀 사이즈 부족 또는 커넥션 반환 누락 의심."

        - alert: HikariCPConnectionsPending
          expr: sum(hikaricp_connections_pending{namespace="<NAMESPACE>"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HikariCP 커넥션 대기 스레드 발생"
            description: "커넥션을 못 받아 대기 중인 스레드가 있음 ({{ $value }}개). 풀 고갈 초기 징후."

        - alert: PostgresConnectionPoolHigh
          expr: |
            (
              sum(pg_stat_activity_count{datname="<DB_NAME>"})
              /
              sum(pg_settings_max_connections)
            ) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Postgres 서버 커넥션 사용률 80% 초과"
            description: "DB 서버 쪽(pg_stat_activity) 커넥션 사용률 {{ $value | printf \"%.1f\" }}%. max_connections 상향 또는 커넥션 정리 필요."