apiVersion: v1
kind: ConfigMap
metadata:
  name: janginmall-cpu-mem-dashboard
  namespace: monitoring   # ⚠️ 실제 EKS에서 Grafana가 설치된 네임스페이스로 변경
  labels:
    grafana_dashboard: "1"
data:
  janginmall-cpu-mem-dashboard.json: |
    {
      "schemaVersion": 42,
      "title": "장인몰 모니터링 (CPU/Mem)",
      "tags": ["janginmall"],
      "editable": true,
      "links": [],
      "liveNow": false,
      "graphTooltip": 0,
      "templating": {
        "list": [
          {
            "current": { "text": "workload-type (Karpenter)", "value": "label_workload_type" },
            "hide": 0,
            "includeAll": false,
            "label": "노드 그룹 판별 라벨",
            "multi": false,
            "name": "node_group_label",
            "options": [
              { "text": "workload-type (Karpenter)", "value": "label_workload_type", "selected": true },
              { "text": "eks 관리형 nodegroup", "value": "label_eks_amazonaws_com_nodegroup", "selected": false }
            ],
            "query": "workload-type (Karpenter) : label_workload_type,eks 관리형 nodegroup : label_eks_amazonaws_com_nodegroup",
            "type": "custom"
          }
        ]
      },
      "panels": [
        {
          "id": 100000,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "type": "row",
          "title": "인프라 영역 (노드)",
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 1 },
          "type": "timeseries",
          "title": "인프라 노드 CPU",
          "description": "⚠️ 카펜터 도입 여부가 아직 미정이라, 상단 대시보드 변수 'node_group_label'로 라벨을 전환할 수 있게 함 — 카펜터 쓰면 workload-type, EKS 관리형 nodegroup만 쓰면 eks 관리형 nodegroup 선택. 어느 쪽이든 kube-state-metrics가 해당 라벨을 노출하도록 --metric-labels-allowlist=nodes=[해당라벨] 설정 필요(기본값은 미노출).",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "#EAB839", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "label_replace(\n  (100 - (avg by (instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100))\n  * on(instance) group_left(node)\n    label_replace(node_uname_info, \"node\", \"$1\", \"nodename\", \"(.+)\")\n  * on(node) group_left(${node_group_label})\n    group by (node, ${node_group_label}) (\n      kube_node_labels{${node_group_label}=~\".+\"}\n    ),\n  \"node_role\", \"$1\", \"${node_group_label}\", \"(.+)\"\n)",
              "legendFormat": "{{node_role}}",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 2,
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 1 },
          "type": "timeseries",
          "title": "인프라 노드 메모리",
          "description": "⚠️ 위 패널과 동일하게 상단 대시보드 변수 'node_group_label'을 따라감. 카펜터를 쓰면 system/app/db/gpu가, 관리형 nodegroup만 쓰면 nodegroup 이름별로 한 그래프에 라인별로 표시됨.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "#EAB839", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "label_replace(\n  ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100)\n  * on(instance) group_left(node)\n    label_replace(node_uname_info, \"node\", \"$1\", \"nodename\", \"(.+)\")\n  * on(node) group_left(${node_group_label})\n    group by (node, ${node_group_label}) (\n      kube_node_labels{${node_group_label}=~\".+\"}\n    ),\n  \"node_role\", \"$1\", \"${node_group_label}\", \"(.+)\"\n)",
              "legendFormat": "{{node_role}}",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 100001,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 10 },
          "type": "row",
          "title": "서비스 영역 (장인몰 파드)",
          "collapsed": false,
          "panels": []
        },
        {
          "id": 3,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 11 },
          "type": "timeseries",
          "title": "장인몰 파드 CPU 사용률",
          "description": "⚠️ <NAMESPACE>, <POD_PREFIX> 를 실제 배포 값으로 교체. cAdvisor/kubelet 지표라 백엔드 언어와 무관 — 변경 없음.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "#EAB839", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", container!=\"\", container!=\"POD\"}[5m]))\n/\nsum(kube_pod_container_resource_limits{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", resource=\"cpu\"})\n* 100",
              "legendFormat": "파드 CPU 사용률 평균",
              "range": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "topk(1,\n  sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", container!=\"\", container!=\"POD\"}[5m]))\n  /\n  sum by (pod) (kube_pod_container_resource_limits{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", resource=\"cpu\"})\n) * 100",
              "legendFormat": "최대 사용 파드 {{pod}}",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 4,
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 11 },
          "type": "timeseries",
          "title": "장인몰 파드 메모리 사용률",
          "description": "⚠️ <NAMESPACE>, <POD_PREFIX> 를 실제 배포 값으로 교체. 언어 무관 지표 — 변경 없음.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "#EAB839", "value": 70 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", container!=\"\", container!=\"POD\"})\n/\nsum(kube_pod_container_resource_limits{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", resource=\"memory\", unit=\"byte\"})\n* 100",
              "legendFormat": "파드 메모리 사용률 평균",
              "range": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "topk(1,\n  sum by (pod) (container_memory_working_set_bytes{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", container!=\"\", container!=\"POD\"})\n  /\n  sum by (pod) (kube_pod_container_resource_limits{namespace=\"<NAMESPACE>\", pod=~\"<POD_PREFIX>.*\", resource=\"memory\", unit=\"byte\"})\n) * 100",
              "legendFormat": "최대 사용 파드 {{pod}}",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 100002,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 20 },
          "type": "row",
          "title": "트래픽 및 에러율",
          "collapsed": false,
          "panels": []
        },
        {
          "id": 5,
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 21 },
          "type": "timeseries",
          "title": "요청량 (RPS)",
          "description": "⚠️ <NAMESPACE> 교체. 스프링부트 Actuator+Micrometer 기준 지표(http_server_requests_seconds_count)로 변경함 — 기존 http_requests_total은 FastAPI(Python) 전용이라 자바 앱에선 안 나옴. actuator 헬스체크 자체 호출은 uri!~\"/actuator.*\"로 제외.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": 0 }]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"<NAMESPACE>\", uri!~\"/actuator.*\"}[1m]))",
              "legendFormat": "RPS",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 6,
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 21 },
          "type": "timeseries",
          "title": "지연시간 (p95/p99)",
          "description": "⚠️ <NAMESPACE> 교체. http_server_requests_seconds_bucket(Micrometer 히스토그램)을 쓰려면 application.yml에 management.metrics.distribution.percentiles-histogram.http.server.requests=true 설정 필요 — 기본값은 off라 이 설정 없으면 버킷 지표 자체가 안 나와서 패널이 빈 그래프가 됨.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 0,
                "lineWidth": 1,
                "showPoints": "auto",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 0.3 }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=\"<NAMESPACE>\", uri!~\"/actuator.*\"}[1m])) by (le))",
              "legendFormat": "p95",
              "range": true
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=\"<NAMESPACE>\", uri!~\"/actuator.*\"}[1m])) by (le))",
              "legendFormat": "p99",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 7,
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 21 },
          "type": "stat",
          "title": "5xx 에러율",
          "description": "⚠️ <NAMESPACE> 교체. http_server_requests_seconds_count의 status 태그 기준으로 변경(자바에서도 태그명은 동일하게 status). 0.1% 초과 시 주의.",
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "blue", "mode": "fixed" },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 0.1 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "(\n  sum(rate(http_server_requests_seconds_count{namespace=\"<NAMESPACE>\", status=~\"5..\"}[5m]))\n  or\n  vector(0)\n)\n/\nsum(rate(http_server_requests_seconds_count{namespace=\"<NAMESPACE>\"}[5m]))\n* 100",
              "legendFormat": "5xx 비율",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 100006,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 },
          "type": "row",
          "title": "JVM / Actuator 지표 (신규 — 스프링부트 특유)",
          "collapsed": false,
          "panels": []
        },
        {
          "id": 16,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 31 },
          "type": "timeseries",
          "title": "JVM 힙 사용률",
          "description": "⚠️ <NAMESPACE> 교체. Actuator+Micrometer가 기본 제공하는 지표라 별도 계측 코드 없이 바로 나옴 (FastAPI엔 없던 지표). /actuator/prometheus 스크레이프 설정만 되면 사용 가능.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 0, "lineWidth": 1, "showPoints": "auto", "spanNulls": false, "stacking": { "group": "A", "mode": "none" } },
              "max": 100,
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "#EAB839", "value": 75 }, { "color": "red", "value": 90 }] },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(jvm_memory_used_bytes{namespace=\"<NAMESPACE>\", area=\"heap\"})\n/\nsum(jvm_memory_max_bytes{namespace=\"<NAMESPACE>\", area=\"heap\"})\n* 100",
              "legendFormat": "힙 사용률",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 17,
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 31 },
          "type": "timeseries",
          "title": "GC 정지시간",
          "description": "⚠️ <NAMESPACE> 교체. 초당 GC에 소요된 시간 비율. 지속적으로 0.1(=10%) 넘으면 힙 사이즈/GC 알고리즘 튜닝 검토 필요.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 0, "lineWidth": 1, "showPoints": "auto", "spanNulls": false, "stacking": { "group": "A", "mode": "none" } },
              "min": 0,
              "unit": "s"
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(jvm_gc_pause_seconds_sum{namespace=\"<NAMESPACE>\"}[5m]))",
              "legendFormat": "GC 정지시간 비율",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 18,
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 40 },
          "type": "timeseries",
          "title": "HikariCP 커넥션 풀 사용률",
          "description": "⚠️ <NAMESPACE> 교체. 아래 'DB 커넥션 풀 사용률' 패널은 Postgres 서버 쪽(pg_stat_activity) 기준이고, 이건 스프링 앱(HikariCP) 쪽 클라이언트 풀 기준이라 별도로 봐야 함 — 커넥션 누수는 보통 여기서 먼저 드러남.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "drawStyle": "line", "fillOpacity": 0, "lineWidth": 1, "showPoints": "auto", "spanNulls": false, "stacking": { "group": "A", "mode": "none" } },
              "max": 100,
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "#EAB839", "value": 70 }, { "color": "red", "value": 90 }] },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(hikaricp_connections_active{namespace=\"<NAMESPACE>\"})\n/\nsum(hikaricp_connections_max{namespace=\"<NAMESPACE>\"})\n* 100",
              "legendFormat": "HikariCP 사용률",
              "range": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "prometheus" }
        },
        {
          "id": 19,
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 40 },
          "type": "timeseries",
          "title": "활성 스레드 수",
