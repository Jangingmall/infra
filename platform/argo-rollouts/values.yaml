# Argo Rollouts Helm values
#
# Chart Version: 2.43.1
# App Version: v1.10.0
#
# Backend Rollout 리소스는 k8s/base/backend/에서 관리한다.
# 이 디렉터리는 Rollout CRD와 Controller 플랫폼 설정만 관리한다.

# Rollout, AnalysisTemplate 등의 CRD를 Helm으로 설치한다.
installCRDs: true

# Helm release 삭제 시 CRD와 기존 Rollout 리소스를 보호한다.
keepCRDs: true

# app namespace를 포함하여 클러스터 전체의 Rollout을 감시한다.
clusterInstall: true

controller:
  # System NodeGroup이 2대이므로 Controller도 2 replica를 유지한다.
  replicas: 2
  # 기존 용량 문서의 Controller 예산을 실제 requests로 명시한다.
  # 2 replica 합계 200m/256Mi이며 배포 시 reconcile 부하를 실측한다.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector:
    workload-type: system
  # 두 Controller가 같은 System 노드에 몰리지 않도록 서로 다른 hostname을 우선한다.
  # 현재 차트는 새 Pod를 먼저 만드는 RollingUpdate 전략을 고정하므로, 강제
  # anti-affinity는 노드 Pod 슬롯/CPU 요청량이 부족할 때 업데이트를 멈출 수 있다.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: argo-rollouts
                app.kubernetes.io/instance: argo-rollouts
                app.kubernetes.io/component: rollouts-controller
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway

  # 현재 ALB TargetGroup 직접 검증 기능은 사용하지 않는다.
  # Backend는 우선 Service selector 기반 Blue/Green으로 운영한다.
  awsVerifyTargetGroup: false

  metrics:
    # 기존 Controller의 8090 metrics Service를 사용한다.
    enabled: true

    # Monitor는 observability/platform에서 관리한다. chart에서 중복 생성하지 않는다.
    serviceMonitor:
      enabled: false

# System medium 1대 + large 1대에서도 상시 메모리를 아끼기 위해 Dashboard만 비활성화한다.
# 위 Controller 2개와 Blue/Green 배포 제어 기능은 그대로 유지한다.
# 평소 상태 조회: kubectl argo rollouts get rollout backend -n app
# 전용 화면이 필요할 때 운영자 PC에서 kubectl argo rollouts dashboard를 실행한다.
# 로컬 화면도 사용자 kubeconfig 권한으로 동작한다. 외부 listen 주소로 공개하지 않는다.
# 기존 enabled=true 환경에 반영하면 Dashboard Deployment/Service가 제거될 수 있다.
# 아래 옵션은 향후 상시 화면이 필요해 재활성화할 경우의 설정을 보존한 것이다.
dashboard:
  enabled: false
  nodeSelector:
    workload-type: system

  # 초기에는 조회 전용으로 사용한다.
  readonly: true

  replicas: 1

  service:
    type: ClusterIP
    port: 3100
    targetPort: 3100

# 현재는 Service selector 기반 Blue/Green만 사용한다.
# Argo Rollouts가 외부 Traffic Provider를 직접 제어하지 않으므로
# Provider 전용 RBAC은 비활성화한다.
providerRBAC:
  enabled: false
