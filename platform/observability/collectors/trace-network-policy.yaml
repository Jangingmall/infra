# Collector 자신의 ingress/egress만 제한한다. 앱의 기존 통신은 변경하지 않는다.
# TODO: Tempo 수신 정책과 app.kubernetes.io/name=tempo 라벨을 실제 배포 시 맞춘다.
# DNS는 CoreDNS 기준이다. NodeLocal DNS 사용 시 실제 경로를 별도 반영한다.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: app
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - backend
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - ai-sglang
          - ai-ollama
    ports:
    - protocol: TCP
      port: 4317
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          operator.prometheus.io/name: metrics-prometheus
    ports:
    - protocol: TCP
      port: 8888
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - tempo
    ports:
    - protocol: TCP
      port: 4317
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
