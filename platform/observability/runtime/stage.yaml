# 비밀값을 넣지 않는다. 인프라가 제공한 실제 ARN/버킷 이름만 아래 위치에 입력한다.
# 이 파일은 외부 Helm chart와 observability-assets chart의 마지막 override로 사용된다.
# Loki: serviceAccount.annotations.eks.amazonaws.com/role-arn + lokiBucket.
# Discord 활성화 시: alertmanager.serviceAccount.annotations.eks.amazonaws.com/role-arn.
lokiBucket: jangin-staging-s3-logs
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::750240012008:role/jangin-staging-irsa-loki
loki:
  storage:
    s3:
      sse:
        type: SSE-KMS
        kms_key_id: arn:aws:kms:ap-northeast-2:750240012008:key/48fa2655-2c4e-43c4-828c-ca511da66c26
alertmanager:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::750240012008:role/jangin-staging-irsa-alertmanager
