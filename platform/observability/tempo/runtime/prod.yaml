# tempoEgressCidrs: [S3 대상 CIDR, regional STS 대상 CIDR]
# CIDR은 인프라·보안팀이 인계한 값이다. 임시 DNS 조회 결과나 0.0.0.0/0을 쓰지 않는다.
# 모든 값이 준비되어야 tempo-runtime이 생성된다. 기본 상태는 DNS 이외 발신 차단이다.
