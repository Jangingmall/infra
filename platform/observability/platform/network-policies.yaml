# 메트릭은 Prometheus만 허용한다. DB는 기존 5432/8000 ingress 정책과 합산된다.
# 새 ingress 정책으로 제어 통신까지 막히지 않도록 아래 기존 비메트릭 포트는 출발지 제한을 추가하지 않는다:
# CNPG webhook 9443, Argo server 8080/repo 8081/appset webhook 7000·probe8081, Rollouts health8080.
# 이는 제어 포트의 최소권한 정책 완료를 의미하지 않는다. 전체 NetworkPolicy 단계에서 실제 호출자/SG와 좁힌다.
# egress를 새로 격리하지 않는다. 향후 Prometheus egress 제한 시 이 7개 수집 경로를 함께 허용해야 한다.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-cnpg-database
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: jangingmall-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          operator.prometheus.io/name: metrics-prometheus
    ports:
    - protocol: TCP
      port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-cnpg-operator
  namespace: cnpg-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/instance: cloudnative-pg
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          operator.prometheus.io/name: metrics-prometheus
    ports:
    - protocol: TCP
      port: 8080
  - ports:
    - protocol: TCP
      port: 9443
---
