    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          operator.prometheus.io/name: metrics-prometheus
    ports:
    - protocol: TCP
      port: 8090
  - ports:
    - protocol: TCP
      port: 8080
