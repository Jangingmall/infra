# NetworkPolicy는 URL 경로를 구분하지 않는다. 이 규칙은 /metrics뿐 아니라 8000 포트를 허용한다.
# Ollama 11434 같은 엔진 포트는 열지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ai-api
  namespace: ai
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [ai-sglang, ai-ollama]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: metrics-prometheus
      ports:
        - {protocol: TCP, port: 8000}
