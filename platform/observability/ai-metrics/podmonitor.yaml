apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ai-api
  namespace: monitoring
  labels:
    release: metrics
spec:
  namespaceSelector:
    matchNames: [ai]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [ai-sglang, ai-ollama]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
        - targetLabel: job
          replacement: ai-api
