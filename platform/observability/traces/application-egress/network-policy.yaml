# 이미 egress가 격리된 앱에 추가하는 opt-in 허용 규칙이다.
# 이 정책만 처음 적용하면 다른 통신이 막힐 수 있다. DNS·DB·AI·외부 API 정책과 함께 검토한다.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-traces
  namespace: app
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - backend
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - otel-collector
    ports:
    - protocol: TCP
      port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-traces
  namespace: ai
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - ai-sglang
      - ai-ollama
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - otel-collector
    ports:
    - protocol: TCP
      port: 4317
