apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
