# 제안 경로. 등록 작업은 수행하지 않았다. 인프라팀 확정 시 IAM Resource와 함께 변경한다.
# SecureString 한 개만 조회한다. secretObjects를 선언하지 않아 K8s Secret으로 복사하지 않는다.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: monitoring-discord
  namespace: monitoring
spec:
  provider: aws
  parameters:
    region: ap-northeast-2
    usePodIdentity: 'false'
    objects: |
      - objectName: "/prod/monitoring/discord-webhook-url"
        objectType: ssmparameter
        objectAlias: discord-webhook-url
        filePermission: '0444'
