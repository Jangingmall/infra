# 기존 Backend ingress 정책에 Prometheus 관리 포트 접근을 합산 허용한다.
# 이 파일 자체는 default-deny가 아니며 외부 ALB에 9090을 공개하지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-backend-metrics
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: metrics-prometheus
      ports:
        - protocol: TCP
          port: 9090
