# NVIDIA chart/app 0.20.0. 드라이버·toolkit은 EKS AL2023 NVIDIA AMI가 제공한다.
fullnameOverride: nvidia-device-plugin
nodeSelector:
  kubernetes.io/os: linux
  workload-type: gpu
# Terraform의 GPU 라벨을 사용하므로 NFD 라벨을 요구하는 기본 affinity를 제거한다.
affinity: null
tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: "true"
    effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
# 장치를 등록하는 Pod 자체는 GPU를 예약하지 않는다. GPU 공유/MIG는 사용하지 않는다.
migStrategy: none
failOnInitError: true
deviceListStrategy: envvar
deviceIDStrategy: uuid
# AMI의 기본 NVIDIA runtime을 사용한다. 존재하지 않는 RuntimeClass는 지정하지 않는다.
runtimeClassName: null
devicePlugin:
  enabled: true
gfd:
  enabled: false
nfd:
  enabled: false
