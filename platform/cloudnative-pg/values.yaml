# CloudNativePG Operator Helm values
#
# Chart Version: 0.29.0
# App Version: 1.30.0

nodeSelector:
  workload-type: system

# System 용량 계산에 포함하는 초기 요청량. DB Pod 자원과는 별개다.
# Operator의 실제 reconcile 부하와 OOM 여부를 EKS에서 확인한다.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
