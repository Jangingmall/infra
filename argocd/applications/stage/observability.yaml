---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-observability-storage
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
spec:
  project: stage-observability
  sources:
  - repoURL: https://github.com/Jangingmall/infra.git
    targetRevision: main
    path: platform/observability/metrics
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-observability-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
spec:
  project: stage-observability
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.4.1
    helm:
      releaseName: metrics
      valueFiles:
      - "$values/platform/observability/metrics/values.yaml"
      - "$values/platform/observability/metrics/stage.yaml"
      - "$values/platform/observability/runtime/stage.yaml"
      skipTests: true
  - repoURL: https://github.com/Jangingmall/infra.git
    targetRevision: main
    path: platform/observability
    ref: values
    helm:
      releaseName: metrics-assets
      valueFiles:
      - runtime/stage.yaml
      valuesObject:
        bundle: metrics
        environment: stage
      skipTests: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
---
