---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-observability-alloy-pods
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: observability
spec:
  project: stage-observability
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      releaseName: alloy-pods
      valueFiles:
      - "$values/platform/observability/logs/alloy-pods.yaml"
      valuesObject:
        alloy:
          configMap:
            create: false
            name: alloy-pods-config
          extraEnv:
          - name: OBS_ENV
            value: stage
          - name: LOKI_PUSH_URL
            value: http://loki-gateway.monitoring.svc/loki/api/v1/push
      skipTests: true
  - repoURL: https://github.com/Jangingmall/infra.git
    targetRevision: main
    path: platform/observability
    ref: values
    helm:
      releaseName: alloy-pods-assets
      valueFiles:
      - runtime/stage.yaml
      valuesObject:
        bundle: alloy-pods
        environment: stage
      skipTests: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
