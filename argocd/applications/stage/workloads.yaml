---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-workloads
  namespace: argocd
spec:
  project: stage-workloads
  source:
    repoURL: https://github.com/Jangingmall/infra.git
    targetRevision: main
    path: k8s/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true
    - PruneLast=true
  ignoreDifferences:
  - group: argoproj.io
    kind: Rollout
    name: backend
    namespace: app
    jsonPointers:
    - "/spec/replicas"
  - group: ''
    kind: Service
    name: backend-active
    namespace: app
    jsonPointers:
    - "/spec/selector/rollouts-pod-template-hash"
  - group: ''
    kind: Service
    name: backend-preview
    namespace: app
    jsonPointers:
    - "/spec/selector/rollouts-pod-template-hash"
